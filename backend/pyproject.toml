[project]
name = "prepflip"
version = "0.1.0"
description = "PrepFlip backend: NEET MCQ practice API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "argon2-cffi>=23.1",
]

[project.scripts]
prepflip-serve = "prepflip.serve:main"
prepflip-hash-password = "prepflip.scripts.hash_password:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prepflip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
